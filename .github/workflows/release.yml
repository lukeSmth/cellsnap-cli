name: release

# Publishing is driven by GitHub Releases: tag, publish the release, and this uploads to PyPI.
on:
  release:
    types: [published]

jobs:
  pypi:
    name: build and publish to PyPI
    runs-on: ubuntu-latest
    # Must match the environment named in the PyPI trusted publisher config.
    environment: pypi
    permissions:
      # OIDC token for trusted publishing. Job-scoped, and the only credential involved --
      # no PyPI API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
