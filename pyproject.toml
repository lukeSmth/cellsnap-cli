[project]
name = "cellsnap-cli"
version = "0.1.0"
description = "Publish rich notebook snapshots without adding .ipynb files to working git history"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "nbformat>=5.7",
    "jupytext>=1.14",
]

[project.scripts]
cellsnap-cli = "cellsnap_cli.cli:main"

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellsnap_cli"]