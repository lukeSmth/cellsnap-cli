[project]
name = "cellsnap-cli"
version = "0.1.0"
description = "Publish rich notebook snapshots without adding .ipynb files to working git history"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luke Smith" }]
keywords = ["jupyter", "notebook", "jupytext", "git", "artifacts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "nbformat>=5.7",
    "jupytext>=1.18",
]

[project.urls]
Repository = "https://github.com/lukeSmth/cellsnap-cli"
Issues = "https://github.com/lukeSmth/cellsnap-cli/issues"

[project.scripts]
cellsnap = "cellsnap_cli.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
    "nbclient",
    "matplotlib",
]

[tool.ruff]
line-length = 120

# Pair every notebook with a py:percent script. The .py is what git tracks; the .ipynb is
# regenerated with `jupytext --sync` and published by cellsnap-cli.
[tool.jupytext]
formats = "ipynb,py:percent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellsnap_cli"]